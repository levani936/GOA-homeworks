<!DOCTYPE html>
<html lang="en">
<head>

    <title>Testimonial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="testimonial">

        <div class="quote-mark">
            “
        </div>

        <div class="text-box">
            <p>
                “ I’ve been interested in coding for a while<br>
                but never taken the jump, until now. I<br>
                couldn’t recommend this course enough.<br>

            </p>

            <div class="person">
                <strong>Tanya Sinclair</strong>

        </div>

        <div class="image-area">

            <div class="pink-lines">
                ≋
            </div>

            <img id="img1" src="./images/image-tanya.jpg" alt="Person">

            <div class="dots">
                • • •<br>
                • • •<br>
                • • •
            </div>

            <div class="buttons">
                <button>‹</button>
                <button>›</button>

    </section>
